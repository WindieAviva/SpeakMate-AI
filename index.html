<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SpeakMate AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 30px;
    }

    .status {
      padding: 15px;
      border-radius: 10px;
      background: #eef2ff;
      margin-bottom: 20px;
      text-align: center;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #connectButton {
      background: #2563eb;
      color: white;
    }

    #disconnectButton {
      background: #ef4444;
      color: white;
    }

    #micButton {
      background: #16a34a;
      color: white;
    }

    .conversation {
      background: #f9fafb;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .conversation h2 {
      margin-top: 0;
    }

    #geminiText {
      min-height: 60px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }

    .log {
      background: #111827;
      color: #d1d5db;
      border-radius: 10px;
      padding: 15px;
      height: 220px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
    }

    .log-title {
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>🎙️ SpeakMate AI</h1>

    <p class="subtitle">
      English Speaking Coach & Interview Simulator
    </p>

    <div id="status" class="status">
      Belum terhubung ke Gemini
    </div>

    <div class="buttons">

      <button
        id="connectButton"
        onclick="connectToGemini()"
      >
        🔗 Connect Gemini
      </button>

      <button
        id="disconnectButton"
        onclick="disconnectFromGemini()"
        disabled
      >
        ❌ Disconnect
      </button>

      <button
        id="micButton"
        onclick="toggleMicrophone()"
        disabled
      >
        🎤 Start Microphone
      </button>

    </div>

    <div class="conversation">

      <h2>🤖 Gemini</h2>

      <div id="geminiText">
        Gemini belum berbicara.
      </div>

    </div>

    <div class="log-title">
      System Log
    </div>

    <div id="log" class="log"></div>

  </div>

</div>

<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbx4wg8kv7krK1Qche47lpHzFsjN5Hn7EXSoCEE4Pae5wGcHk_9zCkYUKUoRPKST6BRL/exec";

const MODEL_NAME =
  "gemini-3.8-live";

let websocket = null;
let tokenWindow = null;

let mediaStream = null;
let audioContext = null;
let microphoneSource = null;
let audioProcessor = null;

let isMicrophoneActive = false;


// =============================
// LOG
// =============================

function log(message) {

  const logElement =
    document.getElementById("log");

  const time =
    new Date().toLocaleTimeString();

  logElement.innerHTML +=
    "[" + time + "] " +
    message +
    "<br>";

  logElement.scrollTop =
    logElement.scrollHeight;

  console.log(message);
}


// =============================
// STATUS
// =============================

function updateStatus(message) {

  document.getElementById("status")
    .innerText = message;

}


// =============================
// CONNECT
// =============================

function connectToGemini() {

  log("Meminta token dari Apps Script...");

  updateStatus(
    "Menghubungkan ke SpeakMate..."
  );

  tokenWindow =
    window.open(
      APPS_SCRIPT_URL + "?bridge=1",
      "SpeakMateToken",
      "width=500,height=400"
    );

  if (!tokenWindow) {

    log(
      "Popup diblokir browser."
    );

    updateStatus(
      "Popup diblokir browser."
    );

    return;
  }

  log(
    "Jendela token bridge dibuka."
  );
}

// =============================
// TOKEN BRIDGE
// =============================

window.addEventListener(
  "message",
  function(event) {

    if (
      event.data &&
      event.data.type ===
      "speakmate-token"
    ) {

      log(
        "Token berhasil diterima."
      );

      if (tokenWindow) {
        tokenWindow.close();
      }

      startGeminiSession(
        event.data.token
      );
    }

    if (
      event.data &&
      event.data.type ===
      "speakmate-token-error"
    ) {

      log(
        "Gagal mendapatkan token: " +
        event.data.error
      );

      updateStatus(
        "Gagal mendapatkan token."
      );
    }

  }
);

// =============================
// GEMINI SESSION
// =============================

function startGeminiSession(token) {

  log(
    "Membuat WebSocket..."
  );

  const websocketUrl =
    "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token=" +
    encodeURIComponent(token);

  websocket =
    new WebSocket(websocketUrl);

  websocket.onopen =
    function() {

      log(
        "WebSocket Connected."
      );

      updateStatus(
        "Mengirim konfigurasi..."
      );

      const setupMessage = {

        setup: {

          model:
            "models/" +
            MODEL_NAME,

          generationConfig: {

            responseModalities:
              ["AUDIO"]

          },

          systemInstruction: {

            parts: [

              {
                text:
                  "You are SpeakMate AI, " +
                  "an English speaking coach. " +
                  "You help users practice " +
                  "English speaking and " +
                  "job interviews. " +
                  "For this initial connection test, " +
                  "greet the user briefly in English."
              }

            ]

          }

        }

      };

      websocket.send(
        JSON.stringify(
          setupMessage
        )
      );

      log(
        "Configuration dikirim."
      );
    };


  websocket.onmessage =
    async function(event) {

      log(
        "Response diterima dari Gemini."
      );

      try {

        let data =
          event.data;

        if (
          data instanceof Blob
        ) {

          log(
            "Response berupa Blob."
          );

          data =
            await data.text();
        }

        if (
          data instanceof ArrayBuffer
        ) {

          log(
            "Response berupa ArrayBuffer."
          );

          data =
            new TextDecoder()
              .decode(data);
        }

        if (
          typeof data !==
          "string"
        ) {

          log(
            "Format response tidak dikenali: " +
            typeof data
          );

          return;
        }

        console.log(
          "Gemini raw response:",
          data
        );

        const response =
          JSON.parse(data);

        console.log(
          "Gemini response:",
          response
        );


        if (
          response.setupComplete
        ) {

          log(
            "Gemini Live session siap."
          );

          updateStatus(
            "Gemini Live siap 🎉"
          );

          document
            .getElementById(
              "micButton"
            )
            .disabled = false;

          document
            .getElementById(
              "disconnectButton"
            )
            .disabled = false;
        }


        if (
          response.serverContent
        ) {

          const serverContent =
            response.serverContent;


          if (
            serverContent
              .outputTranscription
          ) {

            const text =
              serverContent
                .outputTranscription
                .text;

            document
              .getElementById(
                "geminiText"
              )
              .innerText = text;

            log(
              "Gemini: " +
              text
            );
          }


          if (
            serverContent.modelTurn &&
            serverContent.modelTurn.parts
          ) {

            for (
              const part of
              serverContent
                .modelTurn
                .parts
            ) {

              if (
                part.inlineData
              ) {

                log(
                  "Audio dari Gemini diterima."
                );

              }

            }

          }

        }


        if (
          response.error
        ) {

          log(
            "Gemini API ERROR: " +
            JSON.stringify(
              response.error
            )
          );

        }

      }

      catch (error) {

        log(
          "Gagal membaca response: " +
          error.message
        );

        console.error(
          "Response processing error:",
          error
        );

      }

    };


  websocket.onerror =
    function(error) {

      log(
        "WebSocket ERROR."
      );

      console.error(
        "WebSocket error:",
        error
      );

      updateStatus(
        "WebSocket error."
      );
    };


  websocket.onclose =
    function(event) {

      log(
        "WebSocket ditutup. Code: " +
        event.code
      );

      updateStatus(
        "Gemini tidak terhubung."
      );

      document
        .getElementById(
          "micButton"
        )
        .disabled = true;

      document
        .getElementById(
          "disconnectButton"
        )
        .disabled = true;

    };

}


// =============================
// MICROPHONE
// =============================

async function toggleMicrophone() {

  if (
    isMicrophoneActive
  ) {

    stopMicrophone();

    return;
  }


  if (
    !websocket ||
    websocket.readyState !==
      WebSocket.OPEN
  ) {

    log(
      "Gemini belum terhubung."
    );

    return;
  }


  try {

    log(
      "Meminta akses microphone..."
    );


    mediaStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio: {

            channelCount: 1,

            echoCancellation: true,

            noiseSuppression: true,

            autoGainControl: true

          }

        });


    log(
      "Microphone berhasil diaktifkan."
    );


    audioContext =
      new AudioContext();


    log(
      "Audio sample rate: " +
      audioContext.sampleRate +
      " Hz"
    );


    microphoneSource =
      audioContext
        .createMediaStreamSource(
          mediaStream
        );


    audioProcessor =
      audioContext
        .createScriptProcessor(
          4096,
          1,
          1
        );


    audioProcessor.onaudioprocess =
      function(event) {

        if (
          !isMicrophoneActive
        ) return;


        const inputData =
          event.inputBuffer
            .getChannelData(0);


        const pcm16 =
          convertFloat32ToPCM16(
            inputData
          );


        const base64Audio =
          arrayBufferToBase64(
            pcm16.buffer
          );


        if (
          websocket &&
          websocket.readyState ===
            WebSocket.OPEN
        ) {

          const audioMessage = {

            realtimeInput: {

              audio: {

                data:
                  base64Audio,

                mimeType:
                  "audio/pcm;rate=16000"

              }

            }

          };


          websocket.send(
            JSON.stringify(
              audioMessage
            )
          );

        }

      };


    microphoneSource.connect(
      audioProcessor
    );

    audioProcessor.connect(
      audioContext.destination
    );


    isMicrophoneActive =
      true;


    document
      .getElementById(
        "micButton"
      )
      .innerText =
        "🛑 Stop Microphone";


    updateStatus(
      "🎤 Microphone aktif"
    );


    log(
      "🎤 Microphone aktif."
    );

  }

  catch (error) {

    log(
      "Gagal mengakses microphone: " +
      error.message
    );

    console.error(
      "Microphone error:",
      error
    );

  }

}


// =============================
// STOP MICROPHONE
// =============================

function stopMicrophone() {

  isMicrophoneActive =
    false;


  if (audioProcessor) {

    audioProcessor.disconnect();

    audioProcessor =
      null;
  }


  if (microphoneSource) {

    microphoneSource.disconnect();

    microphoneSource =
      null;
  }


  if (mediaStream) {

    mediaStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    mediaStream =
      null;
  }


  if (audioContext) {

    audioContext.close();

    audioContext =
      null;
  }


  document
    .getElementById(
      "micButton"
    )
    .innerText =
      "🎤 Start Microphone";


  updateStatus(
    "Microphone berhenti"
  );


  log(
    "Microphone berhenti."
  );

}


// =============================
// DISCONNECT
// =============================

function disconnectFromGemini() {

  stopMicrophone();


  if (websocket) {

    websocket.close();

    websocket =
      null;
  }


  updateStatus(
    "Terputus dari Gemini."
  );


  log(
    "Gemini disconnected."
  );

}


// =============================
// AUDIO CONVERSION
// =============================

function convertFloat32ToPCM16(
  float32Array
) {

  const buffer =
    new Int16Array(
      float32Array.length
    );


  for (
    let i = 0;
    i < float32Array.length;
    i++
  ) {

    let sample =
      Math.max(
        -1,
        Math.min(
          1,
          float32Array[i]
        )
      );


    buffer[i] =
      sample < 0
        ? sample * 0x8000
        : sample * 0x7FFF;

  }


  return buffer;

}


// =============================
// BASE64
// =============================

function arrayBufferToBase64(
  buffer
) {

  let binary = "";

  const bytes =
    new Uint8Array(
      buffer
    );

  const chunkSize =
    0x8000;


  for (
    let i = 0;
    i < bytes.length;
    i += chunkSize
  ) {

    const chunk =
      bytes.subarray(
        i,
        Math.min(
          i + chunkSize,
          bytes.length
        )
      );


    binary +=
      String.fromCharCode(
        ...chunk
      );

  }


  return btoa(binary);

}

</script>

</body>
</html>
