<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SpeakMate AI</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 15px;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .btn-primary {
      background: #4f46e5;
      color: white;
    }

    .btn-primary:hover {
      background: #4338ca;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      background: #f3f4f6;
      margin-bottom: 15px;
    }

    .status.connected {
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .mic-status {
      margin-top: 15px;
      font-weight: bold;
    }

    .log {
      background: #111827;
      color: #d1d5db;
      padding: 15px;
      border-radius: 10px;
      min-height: 220px;
      max-height: 400px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="header">

      <h1>🎙️ SpeakMate AI</h1>

      <p>
        AI English Speaking Coach & Interview Simulator
      </p>

    </div>


    <!-- GEMINI -->

    <div class="card">

      <h2>🤖 Gemini Live</h2>

      <div
        id="connectionStatus"
        class="status"
      >
        🔴 Disconnected
      </div>


      <button
        id="connectButton"
        class="btn-primary"
        onclick="connectToGemini()"
      >
        Connect Gemini
      </button>


      <button
        id="disconnectButton"
        class="btn-danger"
        onclick="disconnectGemini()"
        disabled
      >
        Disconnect
      </button>

    </div>


    <!-- MICROPHONE -->

    <div class="card">

      <h2>🎤 Speaking Practice</h2>

      <p>
        Hubungkan Gemini terlebih dahulu,
        kemudian aktifkan microphone dan mulai berbicara.
      </p>


      <button
        id="micButton"
        class="btn-primary"
        onclick="toggleMicrophone()"
        disabled
      >
        🎤 Start Microphone
      </button>


      <div
        id="micStatus"
        class="mic-status"
      >
        Microphone: OFF
      </div>

    </div>


    <!-- LOG -->

    <div class="card">

      <h2>📋 System Log</h2>

      <div
        id="log"
        class="log"
      ></div>

    </div>

  </div>


<script>


// =====================================================
// CONFIGURATION
// =====================================================

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbx4wg8kv7krK1Qche47lpHzFsjN5Hn7EXSoCEE4Pae5wGcHk_9zCkYUKUoRPKST6BRL/exec";

const MODEL_NAME =
  "gemini-3.8-live";


// =====================================================
// GLOBAL VARIABLES
// =====================================================

let socket = null;

let audioContext = null;

let mediaStream = null;

let processor = null;

let microphoneActive = false;

let isGeminiConnected = false;

let audioChunkCount = 0;

let playbackContext = null;

let nextPlaybackTime = 0;


// =====================================================
// LOG
// =====================================================

function addLog(message) {

  const log =
    document.getElementById("log");

  const time =
    new Date().toLocaleTimeString();

  log.textContent +=
    "[" +
    time +
    "] " +
    message +
    "\n";

  log.scrollTop =
    log.scrollHeight;

  console.log(message);

}


// =====================================================
// CONNECTION STATUS
// =====================================================

function setConnectionStatus(
  message,
  type = ""
) {

  const status =
    document.getElementById(
      "connectionStatus"
    );

  status.textContent =
    message;

  status.className =
    "status " + type;

}


// =====================================================
// CONNECT GEMINI
// =====================================================

function connectToGemini() {

  if (socket) {

    addLog(
      "WebSocket sudah aktif."
    );

    return;

  }

  addLog(
    "Meminta token dari Apps Script..."
  );

  requestEphemeralToken();

}


// =====================================================
// EPHEMERAL TOKEN
// =====================================================

function requestEphemeralToken() {

  const callbackName =
    "speakMateTokenCallback_" +
    Date.now();


  const script =
    document.createElement("script");


  window[callbackName] =
    function(data) {

      addLog(
        "Response token diterima."
      );


      if (
        !data ||
        !data.success
      ) {

        addLog(
          "Gagal mendapatkan token: " +
          (
            data &&
            data.error
              ? data.error
              : "Unknown error"
          )
        );


        setConnectionStatus(
          "🔴 Gagal mendapatkan token",
          "error"
        );


        cleanup();

        return;

      }


      addLog(
        "Token berhasil diterima."
      );


      cleanup();


      startGeminiSession(
        data.token
      );

    };


  script.onerror =
    function() {

      addLog(
        "Gagal menghubungi Apps Script."
      );


      setConnectionStatus(
        "🔴 Gagal menghubungi server",
        "error"
      );


      cleanup();

    };


  script.src =
    APPS_SCRIPT_URL +
    "?bridge=1&callback=" +
    encodeURIComponent(
      callbackName
    );


  document.body.appendChild(
    script
  );


  function cleanup() {

    delete window[
      callbackName
    ];


    if (
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

  }

}


// =====================================================
// GEMINI LIVE SESSION
// =====================================================

function startGeminiSession(
  token
) {

  addLog(
    "Membuat WebSocket..."
  );


  const wsUrl =
    "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token=" +
    encodeURIComponent(token);


  addLog(
    "Membuka koneksi Live API..."
  );


  socket =
    new WebSocket(wsUrl);


  socket.onopen =
    function() {

      addLog(
        "WebSocket Connected."
      );


      setConnectionStatus(
        "🟢 Connected to Gemini",
        "connected"
      );


      const setupMessage = {

        setup: {

          model:
            "models/" +
            MODEL_NAME,


          generationConfig: {

            responseModalities:
              ["AUDIO"]

          },


          systemInstruction: {

            parts: [

              {

                text:
                  "You are SpeakMate AI, " +
                  "an English speaking coach. " +
                  "You help users practice English speaking " +
                  "and job interviews. " +
                  "Speak naturally and briefly. " +
                  "When the user speaks, respond as a friendly " +
                  "English coach."

              }

            ]

          }

        }

      };


      addLog(
        "Mengirim konfigurasi ke Gemini..."
      );


      socket.send(
        JSON.stringify(
          setupMessage
        )
      );


      addLog(
        "Configuration dikirim."
      );

    };


  // ===================================================
  // GEMINI RESPONSE
  // ===================================================

  socket.onmessage =
    async function(event) {

      addLog(
        "Response diterima dari Gemini."
      );


      if (
        event.data instanceof Blob
      ) {

        addLog(
          "Response berupa Blob."
        );


        try {

          const text =
            await event.data.text();


          processGeminiResponse(
            text
          );

        }

        catch (error) {

          addLog(
            "Gagal membaca Blob: " +
            error.message
          );

        }

        return;

      }


      if (
        typeof event.data === "string"
      ) {

        processGeminiResponse(
          event.data
        );

      }

    };


  socket.onerror =
    function(error) {

      addLog(
        "❌ WebSocket error."
      );


      console.error(
        error
      );


      setConnectionStatus(
        "🔴 WebSocket Error",
        "error"
      );

    };


  socket.onclose =
    function(event) {

      addLog(
        "WebSocket ditutup. Code: " +
        event.code
      );


      socket = null;

      isGeminiConnected =
        false;


      stopMicrophone();


      document.getElementById(
        "connectButton"
      ).disabled = false;


      document.getElementById(
        "disconnectButton"
      ).disabled = true;


      document.getElementById(
        "micButton"
      ).disabled = true;


      setConnectionStatus(
        "🔴 Disconnected"
      );

    };

}


// =====================================================
// PROCESS GEMINI RESPONSE
// =====================================================

function processGeminiResponse(
  text
) {

  try {

    const data =
      JSON.parse(text);


    console.log(
      "Gemini data:",
      data
    );


    // ================================================
    // SETUP COMPLETE
    // ================================================

    if (
      data.setupComplete
    ) {

      addLog(
        "Gemini Live session siap."
      );


      isGeminiConnected =
        true;


      document.getElementById(
        "connectButton"
      ).disabled = true;


      document.getElementById(
        "disconnectButton"
      ).disabled = false;


      document.getElementById(
        "micButton"
      ).disabled = false;


      return;

    }


    // ================================================
    // SERVER CONTENT
    // ================================================

    if (
      data.serverContent
    ) {

      const serverContent =
        data.serverContent;


      // ==============================================
      // MODEL TURN
      // ==============================================

      if (
        serverContent.modelTurn
      ) {

        addLog(
          "🤖 Gemini mengirim respons."
        );


        const parts =
          serverContent
            .modelTurn
            .parts || [];


        parts.forEach(
          function(part) {

            // ----------------------------------------
            // AUDIO
            // ----------------------------------------

            if (
              part.inlineData &&
              part.inlineData.data
            ) {

              addLog(
                "🔊 Audio response Gemini diterima."
              );


              playGeminiAudio(
                part.inlineData.data
              );

            }


            // ----------------------------------------
            // TEXT
            // ----------------------------------------

            if (
              part.text
            ) {

              addLog(
                "🤖 Gemini: " +
                part.text
              );

            }

          }
        );

      }


      // ==============================================
      // TURN COMPLETE
      // ==============================================

      if (
        serverContent.turnComplete
      ) {

        addLog(
          "✅ Gemini selesai merespons."
        );

      }

    }


    // ================================================
    // ERROR
    // ================================================

    if (
      data.error
    ) {

      addLog(
        "❌ Gemini Error: " +
        JSON.stringify(
          data.error
        )
      );

    }

  }

  catch (error) {

    addLog(
      "Gagal membaca response Gemini: " +
      error.message
    );


    console.error(
      error
    );

  }

}


// =====================================================
// START MICROPHONE
// =====================================================

async function startMicrophone() {

  if (
    !isGeminiConnected ||
    !socket
  ) {

    addLog(
      "Gemini belum terhubung."
    );

    return;

  }


  try {

    addLog(
      "Meminta akses microphone..."
    );


    mediaStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio: {

            channelCount: 1,

            echoCancellation: true,

            noiseSuppression: true,

            autoGainControl: true

          }

        });


    addLog(
      "Microphone berhasil diaktifkan."
    );


    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    addLog(
      "Audio sample rate: " +
      audioContext.sampleRate +
      " Hz"
    );


    if (
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();

    }


    const source =
      audioContext.createMediaStreamSource(
        mediaStream
      );


    processor =
      audioContext.createScriptProcessor(
        4096,
        1,
        1
      );


    audioChunkCount = 0;


    processor.onaudioprocess =
      function(event) {

        if (
          !microphoneActive
        ) {

          return;

        }


        if (
          !socket ||
          socket.readyState !==
          WebSocket.OPEN
        ) {

          return;

        }


        const inputData =
          event.inputBuffer
            .getChannelData(0);


        // ==========================================
        // RESAMPLE 48kHz → 16kHz
        // ==========================================

        const targetSampleRate =
          16000;


        const inputSampleRate =
          audioContext.sampleRate;


        const resampled =
          downsampleAudio(
            inputData,
            inputSampleRate,
            targetSampleRate
          );


        const pcmData =
          convertFloat32ToPCM16(
            resampled
          );


        const base64Audio =
          arrayBufferToBase64(
            pcmData
          );


        const message = {

          realtimeInput: {

            audio: {

              data:
                base64Audio,

              mimeType:
                "audio/pcm;rate=16000"

            }

          }

        };


        try {

          socket.send(
            JSON.stringify(
              message
            )
          );


          audioChunkCount++;


          if (
            audioChunkCount % 20 === 0
          ) {

            addLog(
              "🎤 Audio 16kHz sedang dikirim ke Gemini..."
            );

          }

        }

        catch (error) {

          addLog(
            "❌ Gagal mengirim audio: " +
            error.message
          );

        }

      };


    source.connect(
      processor
    );


    processor.connect(
      audioContext.destination
    );


    microphoneActive =
      true;


    document.getElementById(
      "micButton"
    ).textContent =
      "⏹️ Stop Microphone";


    document.getElementById(
      "micStatus"
    ).textContent =
      "Microphone: ON 🎤";


    addLog(
      "🎤 Microphone aktif."
    );

  }

  catch (error) {

    addLog(
      "Gagal mengakses microphone: " +
      error.message
    );


    console.error(
      error
    );


    document.getElementById(
      "micStatus"
    ).textContent =
      "Microphone: ERROR";

  }

}


// =====================================================
// DOWNSAMPLE AUDIO
// =====================================================

function downsampleAudio(
  inputData,
  inputSampleRate,
  targetSampleRate
) {

  if (
    targetSampleRate >=
    inputSampleRate
  ) {

    return inputData;

  }


  const sampleRateRatio =
    inputSampleRate /
    targetSampleRate;


  const newLength =
    Math.round(
      inputData.length /
      sampleRateRatio
    );


  const result =
    new Float32Array(
      newLength
    );


  let offsetResult = 0;

  let offsetBuffer = 0;


  while (
    offsetResult <
    result.length
  ) {

    const nextOffsetBuffer =
      Math.round(
        (
          offsetResult + 1
        ) *
        sampleRateRatio
      );


    let accum = 0;

    let count = 0;


    for (
      let i = offsetBuffer;
      i < nextOffsetBuffer &&
      i < inputData.length;
      i++
    ) {

      accum +=
        inputData[i];

      count++;

    }


    result[offsetResult] =
      count > 0
        ? accum / count
        : 0;


    offsetResult++;

    offsetBuffer =
      nextOffsetBuffer;

  }


  return result;

}


// =====================================================
// TOGGLE MICROPHONE
// =====================================================

async function toggleMicrophone() {

  if (
    microphoneActive
  ) {

    stopMicrophone();

  }

  else {

    await startMicrophone();

  }

}


// =====================================================
// STOP MICROPHONE
// =====================================================

function stopMicrophone() {

  microphoneActive =
    false;


  if (
    processor
  ) {

    processor.disconnect();

    processor =
      null;

  }


  if (
    audioContext
  ) {

    audioContext.close();

    audioContext =
      null;

  }


  if (
    mediaStream
  ) {

    mediaStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    mediaStream =
      null;

  }


  document.getElementById(
    "micButton"
  ).textContent =
    "🎤 Start Microphone";


  document.getElementById(
    "micStatus"
  ).textContent =
    "Microphone: OFF";


  addLog(
    "Microphone dimatikan."
  );

}


// =====================================================
// DISCONNECT GEMINI
// =====================================================

function disconnectGemini() {

  addLog(
    "Memutuskan koneksi Gemini..."
  );


  stopMicrophone();


  if (
    socket
  ) {

    socket.close();

    socket =
      null;

  }


  isGeminiConnected =
    false;


  document.getElementById(
    "connectButton"
  ).disabled = false;


  document.getElementById(
    "disconnectButton"
  ).disabled = true;


  document.getElementById(
    "micButton"
  ).disabled = true;


  setConnectionStatus(
    "🔴 Disconnected"
  );

}


// =====================================================
// FLOAT32 → PCM16
// =====================================================

function convertFloat32ToPCM16(
  float32Array
) {

  const buffer =
    new ArrayBuffer(
      float32Array.length * 2
    );


  const view =
    new DataView(
      buffer
    );


  for (
    let i = 0;
    i < float32Array.length;
    i++
  ) {

    let sample =
      Math.max(
        -1,
        Math.min(
          1,
          float32Array[i]
        )
      );


    sample =
      sample < 0
        ? sample * 0x8000
        : sample * 0x7fff;


    view.setInt16(
      i * 2,
      sample,
      true
    );

  }


  return buffer;

}


// =====================================================
// ARRAY BUFFER → BASE64
// =====================================================

function arrayBufferToBase64(
  buffer
) {

  let binary = "";

  const bytes =
    new Uint8Array(
      buffer
    );


  const chunkSize =
    0x8000;


  for (
    let i = 0;
    i < bytes.length;
    i += chunkSize
  ) {

    const chunk =
      bytes.subarray(
        i,
        i + chunkSize
      );


    binary +=
      String.fromCharCode(
        ...chunk
      );

  }


  return btoa(
    binary
  );

}


// =====================================================
// PLAY GEMINI AUDIO
// =====================================================

function playGeminiAudio(
  base64Data
) {

  try {

    const binaryString =
      atob(base64Data);


    const bytes =
      new Uint8Array(
        binaryString.length
      );


    for (
      let i = 0;
      i < binaryString.length;
      i++
    ) {

      bytes[i] =
        binaryString.charCodeAt(i);

    }


    const pcmData =
      new Int16Array(
        bytes.buffer
      );


    const sampleRate =
      24000;


    if (
      !playbackContext
    ) {

      playbackContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )({

          sampleRate:
            sampleRate

        });

    }


    if (
      playbackContext.state ===
      "suspended"
    ) {

      playbackContext.resume();

    }


    const audioBuffer =
      playbackContext.createBuffer(
        1,
        pcmData.length,
        sampleRate
      );


    const channelData =
      audioBuffer.getChannelData(
        0
      );


    for (
      let i = 0;
      i < pcmData.length;
      i++
    ) {

      channelData[i] =
        pcmData[i] / 32768;

    }


    const source =
      playbackContext
        .createBufferSource();


    source.buffer =
      audioBuffer;


    source.connect(
      playbackContext.destination
    );


    const currentTime =
      playbackContext.currentTime;


    if (
      nextPlaybackTime <
      currentTime
    ) {

      nextPlaybackTime =
        currentTime;

    }


    source.start(
      nextPlaybackTime
    );


    nextPlaybackTime +=
      audioBuffer.duration;


    addLog(
      "🔊 Memutar suara Gemini..."
    );

  }

  catch (error) {

    addLog(
      "❌ Gagal memutar audio Gemini: " +
      error.message
    );


    console.error(
      error
    );

  }

}

</script>

</body>

</html>
